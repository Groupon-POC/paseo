# Changed for Groupon Desk (fork of Paseo, Apache-2.0): productName Groupon Desk, appId com.groupon.desk.work, URL scheme groupon-desk.
npmRebuild: false
# Groupon Desk nests this app in its bundle as the work window (tools/groupon-desk, scripts/desk-release
# in groupon2/engineering-development). Its own id, so macOS never takes it for upstream Paseo or for
# the menu-bar app (com.groupon.desk). Signing and notarisation come from the environment the release
# build sets: CSC_NAME and APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER. A local build signs ad-hoc with
# -c.mac.identity=- -c.mac.hardenedRuntime=false: ad-hoc code under the hardened runtime cannot load
# Electron Framework (library validation, "different Team IDs").
appId: com.groupon.desk.work
# The name in the menu bar, the Dock and the About panel. The executable and the bundle file keep
# Paseo's name, which the packaging hooks and the smoke tests look for.
productName: Groupon Desk
executableName: Paseo
# The window's own scheme: its pages load from groupon-desk://app, and macOS hands it
# groupon-desk://h/<server>/agent/<agent> links. The menu-bar app keeps groupondesk://.
protocols:
  - name: Groupon Desk agent link
    schemes:
      - groupon-desk
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  - "!node_modules/@getpaseo/server/dist/server/builtin-plugins/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  # Preserve physical compiler inputs, including .d.ts files omitted from packaged node_modules.
  - from: ../server/dist/server/builtin-plugins
    to: builtin-plugins
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: getpaseo
  repo: paseo
mac:
  artifactName: "Paseo-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Paseo-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Paseo"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon.png
      to: icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Paseo"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/paseo CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Paseo-${arch}.${ext}"
win:
  artifactName: "Paseo-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
